x-player: &player
  image: choosememe-local:1
  environment: {GAME_HOST: server}
  depends_on:
    server:
      condition: service_started
  restart: unless-stopped
services:
  server:
    build: .
    image: choosememe-local:1
    command: server
    restart: unless-stopped
  player1:
    <<: *player
    ports: ["8091:6080"]
  player2:
    <<: *player
    ports: ["8092:6080"]
  player3:
    <<: *player
    ports: ["8093:6080"]
  player4:
    <<: *player
    ports: ["8094:6080"]
